[options]
; ── Database ──
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo19

; ── Paths ──
addons_path = /opt/odoo/addons,/opt/odoo/custom-addons
data_dir = /var/lib/odoo

; ── Server ──
http_port = 8069
proxy_mode = False
without_demo = all

; ── Logging ──
log_level = info
logfile = None

; ── Security ──
admin_passwd = $pbkdf2-sha512$600000$YWRtaW4$admin
list_db = True

; ── Performance ──
workers = 0
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
